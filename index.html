<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css">
    <title>SkyWay Tutorial</title>
  </head>
  <body>

    <div class="grid-container">

      <div id="remote" class="item">
        <video id="remote-video" autoplay playsinline></video>
        <audio id="remote-audio" autoplay controls></audio>
        <p class="id-text">ID: <span id="remote-id"></span></p>
        <div id="button-area"></div>
      </div>

      <div id="local" class="item">
        <h1 class="heading">Remote Pulmonary Rehabilitation System</h1>

        <p class="id-text">ID: <span id="my-id"></span></p>
        <input id="room-name" placeholder="Room名"></input>
        <button id="local-mute-buton" class="item" label="button" disabled>映像・音声OFF</button>

        <button class="buttons" id="join-button" class="item" label="button">Room作成/参加</button>
        <button class="buttons" id="leave-button" class="item" label="button"　disabled>Room閉じる</button>
        <br>

        <video id="local-video" style="height:45%;" autoplay playsinline></video>
        <audio id="local-audio" autoplay muted controls></audio>
      </div>

    </div>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@skyway-sdk/room/dist/skyway_room-latest.js"></script>
    <script type="text/javascript" src="key.js"></script>
    <script type="text/javascript" src="main.js"></script>
  </body>
</html>
