<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css">
    <title>RPRSystem</title>
  </head>
  <body>

    <div class="grid-container">

      <div id="remote" class="remote-stream">
        <video id="remote-video" autoplay playsinline></video>
        <audio id="remote-audio" autoplay controls></audio>
        <span class="id-text" id="remote-id">ID:</span>
        <div id="button-area"></div>
      </div>

      <div id="local" class="local-stream">
        <h1 class="heading">Remote Pulmonary Rehabilitation System</h1>

        <span class="id-text" id="my-id" ID: </span></p>
        <input id="room-name" placeholder="Room name"></input>
        <button id="local-mute-buton" class="item" label="button" disabled>Video Voice off</button>

        <button class="buttons" id="join-button" class="item" label="button">Join Room</button>
        <button class="buttons" id="leave-button" class="item" label="button"　disabled>Leave Room</button>

        <video id="local-video" style="height:45%;" autoplay playsinline></video>
        <audio id="local-audio" autoplay muted controls></audio>
      </div>

      <div class="parameters">
      </div>


      <!-- Paramaters -->
      <div class="parameters">
        <c class="colorPR">  <a class="note">PR[bpm] </a><a class="data" id="textPR">-- </a></c>
        <c class="colorRR">  <a class="note">RR[bpm] </a><a class="data" id="textRR">-- </a></c>
        <c class="colorSpO2"><a class="note">SpO2[%] </a><a class="data" id="statusSpo2">-- </a></c>
        <c class="colorOther"><a class="note">Battery[%] </a><a class="note" id="statusBatteryLavel">-- </a></c>
      </div>



    </div>


    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@skyway-sdk/room/dist/skyway_room-latest.js"></script>
    <script type="text/javascript" src="key.js"></script>
    <script type="text/javascript" src="main.js"></script>
  </body>
</html>
