<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css">
    <title>RPRSystem</title>
  </head>
  <body>

  <div class="grid-container">

      <div id="remote" class="remote-view">
        <div class="remote-stream">
          <video id="remote-video" autoplay playsinline></video>
        </div>
        <audio id="remote-audio" autoplay controls></audio>
        <div id="button-area"></div>
      </div>


      <div id="local" class="local-view">
        <h1 class="heading">Remote Pulmonary Rehabilitation System</h1>
        <input id="room-name" placeholder="Room name"></input><br>
        <button id="join-button" class="buttons">Join</button>
        <button id="leave-button" class="buttons" disabled>Leave</button><p>

        <dir class="local-stream">
          <video id="local-video" autoplay playsinline></video>
        </dir>
        <audio id="local-audio" autoplay muted controls></audio>
        <button id="local-mute-buton" disabled>映像・音声OFF</button>
      </div>

      <!-- Paramaters -->
      <div class="parameter-view">
        <c class="colorPR">  <a class="note">PR[bpm] </a><a class="data" id="textPR">24 </a></c>
        <c class="colorRR">  <a class="note">RR[bpm] </a><a class="data" id="textRR">84 </a></c>
        <c class="colorSpO2"><a class="note">SpO2[%] </a><a class="data" id="statusSpo2">98 </a></c>
        <c class="colorOther"><a class="note">Battery[%] </a><a class="note" id="statusBatteryLavel">95 </a></c>
      </div>


  </div>

  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@skyway-sdk/room/dist/skyway_room-latest.js"></script>
  <script type="text/javascript" src="key.js"></script>
  <script type="text/javascript" src="main.js"></script>
  </body>
</html>
